name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bot:
    name: Telegram-бот (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cafe-bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt ruff==0.6.9
      - name: Lint
        run: ruff check --select E,F,W,B,UP --ignore E501 .
      - name: Import check
        # Импортируем модуль без запуска polling: проверяем, что зависимости и хендлеры собираются
        run: BOT_TOKEN=123:test ADMIN_ID=1 python -c "import bot; print('handlers:', len(bot.dp.message.handlers) + len(bot.dp.callback_query.handlers))"

  api:
    name: API (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --select E,F,W,B,UP --ignore E501 .
      - name: Tests
        run: pytest -v
      - name: Docker image builds
        run: docker build -t portfolio-api .

  parity:
    name: Демо считает как сервер (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      # Те же примеры, что в backend/tests/test_parity.py, прогоняются по коду из projects/shared/api.js
      - name: Parity
        run: node tools/parity.mjs

  demos:
    name: Демо-сайты прописаны везде
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check
        run: python tools/demos.py check
      - name: Lint tools
        run: pip install ruff==0.6.9 && ruff check --select E,F,W,B,UP --ignore E501 tools

  links:
    name: Битые ссылки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          # 404.html ссылается на абсолютный путь /portfolio/, он проверяется уже на Pages.
          # assets/ генерирует воркфлоу Assets после пуша, поэтому эти файлы здесь не проверяем.
          args: --offline --no-progress --exclude-path 404.html --exclude '^data:' --exclude 'assets/' './**/*.html'
          fail: true
