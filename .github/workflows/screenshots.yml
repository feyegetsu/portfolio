name: Assets

# При каждом изменении сайта: свежие скриншоты, OG-картинка и замер Lighthouse.
# Результат коммитится в assets/, README и карточки берут его оттуда.
on:
  push:
    branches: [main]
  workflow_dispatch:

# По умолчанию только чтение: Playwright, npm и pip ставятся без права записи в репозиторий.
# Запись нужна одной задаче commit, и она ничего не скачивает из npm и pip
permissions:
  contents: read

concurrency:
  group: assets
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.changes.outputs.site }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
      # Только README и assets/ — замеры не нужны, но воркфлоу завершается успешно и запускает деплой
      - name: What changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" HEAD | grep -qvE '^assets/|\.md$'; then echo "site=true"; else echo "site=false"; fi >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        if: steps.changes.outputs.site == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        if: steps.changes.outputs.site == 'true'
        with:
          node-version: "20"

      - name: Install Playwright
        if: steps.changes.outputs.site == 'true'
        run: |
          pip install playwright==1.65.2
          python -m playwright install --with-deps chromium

      - name: Start local server
        if: steps.changes.outputs.site == 'true'
        run: |
          python -m http.server 8000 >/dev/null 2>&1 &
          sleep 1

      - name: Screenshots
        if: steps.changes.outputs.site == 'true'
        run: python tools/screenshots.py http://localhost:8000

      - name: Lighthouse
        if: steps.changes.outputs.site == 'true'
        run: |
          mkdir -p .lh
          run() {
            npx -y lighthouse@12.2.1 "http://localhost:8000/$2" $3 --output=json --output-path=".lh/$1.json" \
              --chrome-flags="--headless=new --no-sandbox" --quiet || true
          }
          run home-mobile ""
          run home-desktop "" --preset=desktop
          # Все демо из реестра projects/demos.json: новое демо попадает в замеры без правки воркфлоу
          for p in $(python -c "import json; print(' '.join(d['slug'] for d in json.load(open('projects/demos.json', encoding='utf-8'))['demos']))"); do
            run "$p" "projects/$p/"
          done
          python tools/lh_summary.py .lh --readme README.md > assets/lighthouse.json
          cat assets/lighthouse.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: steps.changes.outputs.site == 'true'
        with:
          name: assets
          path: |
            assets/
            README.md
          retention-days: 3

  commit:
    needs: assets
    if: needs.assets.outputs.site == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: assets
          path: .
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && exit 0
          git commit -m "Обновить скриншоты и замеры Lighthouse [skip ci]"
          # Параллельный пуш в main не должен ронять коммит ассетов: до трёх попыток
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
