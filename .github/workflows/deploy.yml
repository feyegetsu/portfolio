name: Deploy

# Сайт собирается перед публикацией: пререндер содержимого для поиска, минификация, версии файлов.
# Один деплой на пуш: его запускает воркфлоу Assets, когда успешно закончил (скриншоты уже в main).
# Assets идёт на каждый пуш в main; если менялись только README и assets/, он пропускает замеры,
# но всё равно завершается — и деплой правок README тоже происходит.
on:
  workflow_run:
    workflows: [Assets]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Неуспешный Assets не деплоим: в main могли не попасть свежие скриншоты, а сам пуш мог быть сломан
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          ref: main
          fetch-depth: 0  # полная история: даты последних изменений страниц для sitemap.xml

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          pip install playwright==1.65.2
          python -m playwright install --with-deps chromium

      - name: Build
        run: python tools/build.py _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
