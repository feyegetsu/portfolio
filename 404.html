<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена | feyegetsu.dev</title>
  <link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")==="dark"?"dark":"light"}catch(e){}</script>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    :root { --bg: #064E3B; --text: #FFFFFF; --muted: #A7F3D0; --accent: #FBBF24; --accent-hover: #F59E0B; --accent-text: #451A03; --num: #FBBF24; color-scheme: dark; }
    :root[data-theme="dark"] { --bg: #021811; --text: #D1FAE5; --muted: #6EE7B7; --accent: #D97706; --accent-hover: #EA8A0E; --accent-text: #1C0A00; --num: #F59E0B; }
    body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 20px; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif; }
    h1 { font: 700 clamp(5rem, 20vw, 10rem) "Unbounded", sans-serif; color: var(--num); line-height: 1; }
    p { color: var(--muted); margin: 16px 0 32px; }
    a { display: inline-block; padding: 14px 26px; border-radius: 999px; background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; transition: background .2s; }
    a:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Такой страницы нет. Работы, цены и контакты — на главной.</p>
    <a href="/portfolio/">На главную</a>
  </main>
</body>
</html>
