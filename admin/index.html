<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка — заявки, записи и заказы | feyegetsu.dev</title>
  <meta name="description" content="Демо админ-панели для сайтов портфолио: заявки, записи, заказы, каталог и команда с ролями.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Вход -->
  <main class="login" id="loginView" hidden>
    <form class="login__card" id="loginForm">
      <a class="login__back" href="../">← В портфолио</a>
      <div class="brand"><span class="brand__mark">fd</span> Админка</div>
      <h1>Вход</h1>
      <p class="muted" id="loginHint"></p>
      <label>E-mail<input name="email" type="email" autocomplete="username" required></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="btn btn--primary" type="submit">Войти</button>
      <div class="login__demo" id="demoUsers"></div>
    </form>
  </main>

  <!-- Приложение -->
  <div class="app" id="appView" hidden>
    <aside class="side">
      <div class="brand"><span class="brand__mark">fd</span> Админка</div>
      <nav class="side__nav" id="nav" aria-label="Разделы"></nav>
      <div class="side__foot">
        <div class="mode" id="modeBadge"></div>
        <a href="../" class="side__link">← В портфолио</a>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <h1 id="viewTitle">Обзор</h1>
        <div class="top__right">
          <label class="select"><span class="sr-only">Сайт</span><select id="siteFilter" aria-label="Фильтр по сайту"></select></label>
          <div class="user" id="userBox"></div>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="../projects/shared/api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
