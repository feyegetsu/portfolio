# Миграции схемы БД. Адрес базы берётся из DATABASE_URL (app/config.py), здесь его нет.
#   python -m app.migrate        обновить схему до последней версии (так делает Docker-образ при старте)
#   alembic revision --autogenerate -m "что изменилось"   новая миграция по изменениям в app/models.py
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
