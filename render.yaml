# Деплой API на Render одной кнопкой: Dashboard → New → Blueprint → этот репозиторий.
# Поднимаются три сервиса: API из backend/Dockerfile, PostgreSQL и Key Value (Redis) для общих лимитов.
# После деплоя откройте портфолио с ?api=https://<адрес-api>.onrender.com — демо начнут писать в настоящую базу.
services:
  - type: web
    name: portfolio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: portfolio-limits
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://feyegetsu.github.io
      # Запросы приходят через балансировщик Render, реальный IP посетителя — в X-Forwarded-For
      - key: FORWARDED_ALLOW_IPS
        value: "*"

  - type: keyvalue
    name: portfolio-limits
    plan: free
    ipAllowList: []

databases:
  - name: portfolio-db
    plan: free
