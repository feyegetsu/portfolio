# Линтер для всего Python в репозитории: бэкенд, бот, инструменты и e2e. CI запускает `ruff check .`
line-length = 140
extend-exclude = ["_site"]

[lint]
# Стиль и ошибки (E, F, W), частые баги (B), современный синтаксис (UP), безопасность (S),
# слишком широкие except (BLE), даты без часового пояса (DTZ), прочие проверки ruff (RUF)
select = ["E", "F", "W", "B", "UP", "S", "BLE", "DTZ", "RUF"]
# RUF001–003: кириллица в строках и комментариях — не опечатка; длинные строки — по месту
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# В тестах assert — норма, пароли и токены — тестовые, а «настенное» время без пояса — то, что шлют сайты
"backend/tests/**" = ["S101", "S105", "S106", "S107", "S310", "DTZ"]
"projects/cafe-bot/tests/**" = ["S101", "S105", "S106"]
"tests-e2e/**" = ["S101", "S310", "S603", "S607", "DTZ"]
"tools/test_*.py" = ["S101"]
